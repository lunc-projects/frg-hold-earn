[package]
name = "frg-nft"
version = "0.1.0"
edition = "2021"
description = "FRG bonus NFT collection (CW721) for the FRG Hold & Earn app — NOT deployed"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cosmwasm-std = "1.5"
cosmwasm-schema = "1.5"
cw-storage-plus = "1.2"
cw-utils = "1.0"
cw2 = "1.1"
serde = { version = "1.0", default-features = false, features = ["derive"] }
schemars = "0.8"
thiserror = "1.0"

[dev-dependencies]
cosmwasm-std = { version = "1.5", features = ["staking"] }
